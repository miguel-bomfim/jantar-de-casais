<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convite – Jantar para casais</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Allura&family=Mrs+Saint+Delafield&family=Great+Vibes&family=Montserrat:wght@500&display=swap"
    rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: Montserrat, Arial, sans-serif;
      background: #2a0707;
      color: #f3e9d8;
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      padding: 24px
    }

    canvas {
      width: min(92vw, 405px);
      height: auto;
      box-shadow: 0 10px 40px #0008;
      border-radius: 6px
    }

    .panel {
      width: min(92vw, 360px)
    }

    h1 {
      font-size: 18px;
      margin: 0 0 6px
    }

    p {
      font-size: 13px;
      opacity: .8;
      margin: 0 0 18px
    }

    label {
      display: block;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin: 14px 0 6px
    }

    input[type=text] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #b88;
      background: #fff;
      font-size: 16px
    }

    button {
      margin-top: 22px;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #f3e9d8;
      color: #5a0b0b;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer
    }
  </style>
</head>

<body>
  <canvas id="c" width="1080" height="1920"></canvas>
  <div class="panel">
    <h1>Personalizar convite</h1>
    <p>Digite o nome do casal convidado. O nome aparece na frente do envelope.</p>
    <label>Nome do casal</label>
    <input type="text" id="nome" value="Leandro & Carol">
    <label>Fonte do nome</label>
    <select id="fonte" style="width:100%;padding:12px;border-radius:8px;font-size:15px">
      <option value="Liana">Liana</option>
      <option value="Mrs Saint Delafield">Mrs Saint Delafield</option>
      <option value="Allura">Allura</option>
      <option value="Great Vibes">Great Vibes</option>
    </select>
    <label>Texto acima do nome</label>
    <input type="text" id="rotulo" value="Convite especial para">
    <button id="dl">Baixar convite (PNG)</button>
    <div id="saved" style="margin-top:16px"></div>
  </div>

    const c = document.getElementById('c'), x = c.getContext('2d');
    function draw() {
      x.clearRect(0, 0, 1080, 1920); x.drawImage(img, 0, 0, 1080, 1920);
      const rot = document.getElementById('rotulo').value.toUpperCase();
      const nome = document.getElementById('nome').value.trim();
      x.textAlign = 'center'; x.textBaseline = 'alphabetic';
      x.fillStyle = '#f3e9d8';
      if (x.letterSpacing !== undefined) x.letterSpacing = '7px';
      x.font = '500 26px Montserrat, Arial, sans-serif';
      x.fillText(rot, 540 + 3, 1352);
      if (x.letterSpacing !== undefined) x.letterSpacing = '0px';
      const f = document.getElementById('fonte').value;
      let s = 150;
      do { x.font = s + 'px "' + f + '", "Allura", cursive'; s -= 2 } while (x.measureText(nome).width > 640 && s > 40);
      x.fillText(nome, 540, 1460);
      // linha dourada + losango, igual ao padrão da arte
      x.strokeStyle = '#b99a5b'; x.lineWidth = 2;
      x.beginPath(); x.moveTo(400, 1500); x.lineTo(516, 1500); x.moveTo(564, 1500); x.lineTo(680, 1500); x.stroke();
      x.fillStyle = '#b99a5b'; x.beginPath(); x.moveTo(540, 1490); x.lineTo(548, 1500); x.lineTo(540, 1510); x.lineTo(532, 1500); x.fill();
    }
    img.onload = draw;
    document.getElementById('fonte').addEventListener('change', () => { document.fonts.load('60px "' + document.getElementById('fonte').value + '"').then(draw) });
    ['nome', 'rotulo'].forEach(i => document.getElementById(i).addEventListener('input', draw));
    document.fonts.load('60px "Allura"').then(draw); document.fonts.load('500 26px Montserrat').then(draw);
    document.getElementById('dl').onclick = () => {
      const nome = 'convite-' + (document.getElementById('nome').value || 'casal').replace(/[^\w]+/g, '-') + '.png';
      c.toBlob(async blob => {
        const file = new File([blob], nome, { type: 'image/png' });
        const box = document.getElementById('saved');
        const url = URL.createObjectURL(blob);
        box.innerHTML = '<p>Se o download não começou, <b>toque e segure a imagem abaixo</b> e escolha "Salvar imagem" / "Adicionar às Fotos".</p><img src="' + url + '" style="width:100%;border-radius:6px">';
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file], title: 'Convite' }); return } catch (e) { if (e.name === 'AbortError') return }
        }
        const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
      }, 'image/png');
    };
  </script>
